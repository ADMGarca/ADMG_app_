name: Build and Deploy Flutter Web to GitHub Pages (docs/ on main)

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Use 'channel' for channel names like 'stable' (the action expects 'channel' when a channel is provided)
          channel: 'stable'

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web (release)
        run: flutter build web --release --base-href /ADMG_app_/

      - name: Prepare docs folder
        run: |
          rm -rf docs || true
          mkdir -p docs
          cp -r build/web/* docs/

      - name: Commit and push docs to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "chore(web): update GitHub Pages (docs) [skip ci]"
            git push origin HEAD:main
          fi
