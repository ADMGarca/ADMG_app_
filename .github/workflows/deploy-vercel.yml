name: Deploy Flutter Web to Vercel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (base-href "/" for Vercel)
        run: flutter build web --release --base-href "/" --source-maps

      - name: Ensure SPA routing config is present
        run: |
          if [ -f vercel.json ]; then
            cp vercel.json build/web/vercel.json
          else
            echo '{
              "rewrites": [ { "source": "/(.*)", "destination": "/index.html" } ]
            }' > build/web/vercel.json
          fi

      - name: Install Vercel CLI Action
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: build/web
