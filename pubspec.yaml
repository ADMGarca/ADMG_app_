name: admg_app
description: "Aplicativo ADMG - Gerenciamento de Avisos e Pedidos de Oração"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.8.4
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  # updated to latest compatible with Dart 3.7
  http: ^1.5.0
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_masked_text2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # keep lints compatible with current SDK
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/assets/img/logo/Logo.png
    - assets/assets/biblia/
    - assets/assets/harpa/