name: admg_app
description: "Aplicativo ADMG - Gerenciamento de Avisos e Pedidos de Oração"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  shared_preferences: ^2.2.2
  intl: ^0.18.0
  http: ^1.2.2
  pdf: ^3.10.7
  printing: ^5.12.0
  flutter_masked_text2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/assets/img/logo/Logo.png
    - assets/assets/biblia/
    - assets/assets/harpa/