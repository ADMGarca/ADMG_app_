<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.dffff

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/ADMG_app_/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="admg_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>admg_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter.js" defer></script>
  <script>
    // Carrega a entrada do Flutter (main.dart.js) após o carregamento da página.
    // Substitui a referência a flutter_bootstrap.js ausente.
    window.addEventListener('load', function () {
      if (window._flutter && _flutter.loader && _flutter.loader.loadEntrypoint) {
        _flutter.loader.loadEntrypoint({ entrypointUrl: 'main.dart.js' })
          .then(function (engineInitializer) { return engineInitializer.initializeEngine(); })
          .then(function (appRunner) { return appRunner.runApp(); })
          .catch(function (err) { console.error('Erro ao carregar Flutter:', err); });
      } else {
        // Fallback simples: tenta carregar main.dart.js diretamente
        var s = document.createElement('script');
        s.src = 'main.dart.js';
        s.type = 'application/javascript';
        document.body.appendChild(s);
      }
    });
  </script>
</body>
</html>
