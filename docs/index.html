<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.dffff

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/ADMG_app_/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="admg_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>admg_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function(){
      // Try a list of absolute bootstrap/script paths in order until one loads.
      // This handles GitHub Pages normalizing the repo path to lowercase and
      // ensures the app loads whether assets are under /admg_app_/ or /ADMG_app_/.
      function tryPaths(paths, i){
        if(i >= paths.length) return;
        var s = document.createElement('script');
        s.src = paths[i];
        s.async = false;
        s.onload = function(){ console.log('Loaded', paths[i]); };
        s.onerror = function(){ tryPaths(paths, i+1); };
        document.head.appendChild(s);
      }

      var paths = [
        '/admg_app_/flutter_bootstrap.js',
        '/ADMG_app_/flutter_bootstrap.js',
        '/admg_app_/flutter.js',
        '/ADMG_app_/flutter.js',
        '/admg_app_/main.dart.js',
        '/ADMG_app_/main.dart.js'
      ];
      tryPaths(paths, 0);
    })();
  </script>
</body>
</html>
